[package]
name = "dotani"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/jianshu93/dotANI.git"

[build-dependencies]
bindgen = "0.66.1"
cc = "1.0.82"
regex = "1.9.3"

[features]
cuda = ["dep:cudarc"]

[dependencies]
log = "0.4.20"
env_logger = "0.11.3"
chrono = "0.4.38"
glob = "0.3.1"
indicatif = "0.17.7"
clap = { version = "4.4.6", features = ["cargo"] }
serde = { version = "1.0.193", features = ["derive"] }
anyhow = "1"
crossbeam-channel = "0.5"
zstd = { version = "0.13", features = ["zstdmt"] }
cudarc = { version = "0.19.4", features = [
    "driver",
    "nvrtc",
    "cuda-version-from-build-system"], optional = true }

bincode = "1.3.3"
rayon = "1.8.0"
rand = "0.8.5"
indexmap = "2.0.2"

needletail = "0.5.1"
rust-seq2kminmers = "0.1.0"

wyhash = "0.5.0"
t1ha = "0.1.0"

bloom = "0.3.2"

bitpacking = "0.9.2"
ndarray = "0.15.6"
ultraloglog = "0.1.6"

[[bin]]
name = "dotani"
path = "src/main.rs"

[profile.dev]
opt-level = 3
overflow-checks = false

[profile.release]
opt-level = 3
panic = "abort"
lto = true
